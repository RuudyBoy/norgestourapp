name: norges_tour_app
description: "Spikedunk: spillerapp for sandvolleyball med turneringer, live-resultater, statistikk og fantasy."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App-ikonet lages fra ntlogo.png med `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/ntlogo.png"
